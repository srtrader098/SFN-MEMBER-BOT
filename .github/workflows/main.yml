name: SFN Member Bot

on:
  schedule:
    # প্রতি ৬ ঘণ্টায় অটোমেটিক রান হবে
    - cron: '0 */6 * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyrogram tgcrypto requests

      - name: Run bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: python main.py
